[project]
name = "kaggle-agent-security-2026"
version = "0.1.0"
description = "Reproducible competition workspace for Kaggle AI Agent Security 2026"
requires-python = ">=3.12,<3.13"
dependencies = [
  "kaggle>=1.7,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
# Keep the auditable starter copy byte-for-byte close to Kaggle's notebook.
exclude = ["baselines/official_starter_v17/attack.py"]
